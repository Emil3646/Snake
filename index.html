<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Snake Kaboom</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      /* grassy meadow background with stronger visible grain + thicker veins */
      background-image:
        linear-gradient(180deg, #dff0b8 0%, #98d86a 45%, #5fb43a 100%),
        repeating-linear-gradient(-65deg, rgba(20,40,20,0.12) 0 3px, transparent 3px 23px),
        radial-gradient(circle, rgba(0,0,0,0.12) 1px, transparent 3px),
        radial-gradient(circle at 50% 10%, rgba(0,0,0,0.12), transparent 40%);
      background-blend-mode: normal, multiply, overlay, multiply;
      background-size: cover, 23px 23px, 6px 6px, cover;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: 52px; /* reserve space for UI bar */
    }
    canvas {
      display: block;
      transform-origin: center center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      border-radius: 8px;
      position: relative;
      z-index: 2;
    }
    #mobile-controls {
      position: fixed;
      left: 50%;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: none;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      width: min(560px, calc(100% - 12px));
      z-index: 9997;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }
    #mobile-controls.is-visible {
      display: flex;
    }
    #mobile-dpad {
      display: grid;
      grid-template-columns: repeat(3, minmax(52px, 72px));
      grid-template-rows: repeat(2, minmax(52px, 72px));
      gap: 8px;
      padding: 8px;
      border-radius: 12px;
      background: rgba(18, 35, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }
    .mobile-btn {
      border: 0;
      border-radius: 10px;
      background: linear-gradient(180deg, #f6efcd, #cfbf7d);
      color: #283000;
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      touch-action: none;
      min-width: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mobile-btn .arrow-glyph {
      width: 24px;
      height: 24px;
      fill: #2a3203;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,0.18));
      pointer-events: none;
    }
    .mobile-btn:active {
      transform: translateY(1px) scale(0.98);
      filter: brightness(0.95);
    }
    #mobile-up { grid-column: 2; grid-row: 1; }
    #mobile-left { grid-column: 1; grid-row: 2; }
    #mobile-down { grid-column: 2; grid-row: 2; }
    #mobile-right { grid-column: 3; grid-row: 2; }
    #mobile-pause-btn {
      position: fixed !important;
      top: calc(8px + env(safe-area-inset-top, 0px)) !important;
      right: 8px !important;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: #6fa8ff;
      color: #021028;
      font-family: 'Press Start 2P', monospace;
      font-size: 0;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 11010;
    }
    #mobile-pause-btn .pause-glyph {
      width: 20px;
      height: 20px;
      fill: #021028;
      pointer-events: none;
    }
    .mobile-menu-play-btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      background: linear-gradient(180deg, #bff28f, #5ea837);
      color: #0b2a08;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }
    #dom-mobile-start-play {
      position: fixed;
      left: 50%;
      top: auto;
      bottom: 220px;
      transform: translateX(-50%);
      z-index: 11000;
    }
    body.mobile-mode #mobile-controls {
      width: min(560px, calc(100% - 10px));
      gap: 10px;
    }
    body.mobile-mode #mobile-dpad {
      background: linear-gradient(180deg, rgba(32, 82, 31, 0.88), rgba(20, 62, 28, 0.9));
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    }
    body.mobile-mode .mobile-btn {
      border-radius: 14px;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.12);
    }
    body.mobile-mode .mobile-btn .arrow-glyph {
      width: 28px;
      height: 28px;
    }
    body.mobile-mode #mobile-pause-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      top: calc(8px + env(safe-area-inset-top, 0px)) !important;
      right: 8px !important;
    }
    body.mobile-mode #dom-mobile-start-play {
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    body.mobile-controls-active {
      padding-bottom: 170px;
    }
  </style>
</head>
<body>

<script src="https://unpkg.com/kaboom/dist/kaboom.js"></script>
<script>
/* =======================
   Spielfeld / Grid (konfigurierbar; vor kaboom init)
======================= */
const cols = 20;
const rows = 12;
// Zellgröße reduzieren, damit das Spielfeld kleiner auf dem Bildschirm erscheint
const cell = 48;
const startSpeed = 4;
// increase speed by 0.1 per score point
const accel = 0.1;
const maxSpeed = 12;

kaboom({
  width: cols * cell,
  height: rows * cell,
  background: [0, 0, 0, 0], // transparent so CSS meadow shows through
});

const MOBILE_CONTROL_BREAKPOINT = 980;
let lastPauseToggleAt = 0;
let mobilePauseAnchor = null;

function isMobileControlsMode() {
  try {
    const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    const hasTouch = coarse || (navigator && navigator.maxTouchPoints > 0);
    return !!(hasTouch && window.innerWidth <= MOBILE_CONTROL_BREAKPOINT);
  } catch (e) {
    return window.innerWidth <= 760;
  }
}

function getMobileTextScale() {
  if (!isMobileControlsMode()) return 1;
  const shortEdge = Math.max(280, Math.min(window.innerWidth, window.innerHeight));
  return Math.max(0.58, Math.min(1, shortEdge / 430));
}

function getMobileUiScale() {
  if (!isMobileControlsMode()) return 1;
  const shortEdge = Math.max(280, Math.min(window.innerWidth, window.innerHeight));
  return Math.max(0.7, Math.min(1, shortEdge / 420));
}

function getResponsiveTextSize(basePx, minPx) {
  if (!isMobileControlsMode()) return basePx;
  const scaled = Math.round(basePx * getMobileTextScale());
  return Math.max(minPx, scaled);
}

function getResponsiveUiSize(basePx, minPx) {
  if (!isMobileControlsMode()) return basePx;
  const scaled = Math.round(basePx * getMobileUiScale());
  return Math.max(minPx, scaled);
}

function getLayoutReservedSpace() {
  const mobileMode = isMobileControlsMode();
  const uiBar = document.getElementById("ui-bar");
  const uiTop = mobileMode
    ? (uiBar ? Math.ceil(uiBar.getBoundingClientRect().height) + 16 : 64)
    : 52;
  const mobileControls = document.getElementById("mobile-controls");
  const mobileVisible = !!(mobileControls && mobileControls.classList.contains("is-visible"));
  const bottom = mobileVisible ? Math.ceil(mobileControls.getBoundingClientRect().height) + 22 : 0;
  return { top: Math.max(52, uiTop), bottom: Math.max(0, bottom) };
}

function handlePauseToggleInput() {
  const now = Date.now();
  // Mobile browsers can fire near-duplicate press events; ignore rapid re-triggers.
  if (now - lastPauseToggleAt < 280) return;
  lastPauseToggleAt = now;

  if (!started) return resetGame();
  if (gameOver) return resetGame();
  if (!paused) showPauseOverlay();
  else startResumeCountdown();
}

function attachMobileDirectionButton(btn, dirObj) {
  if (!btn || !dirObj) return;
  const handler = (e) => {
    e.preventDefault();
    e.stopPropagation();
    trySetDir(dirObj);
  };
  btn.addEventListener("pointerdown", handler);
  btn.addEventListener("touchstart", handler, { passive: false });
}

function setMobileArrowIcon(btn, dirName) {
  if (!btn) return;
  const rotation = {
    up: 0,
    right: 90,
    down: 180,
    left: 270,
  };
  const deg = rotation[dirName] || 0;
  btn.innerHTML = `<svg class="arrow-glyph" viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(${deg}deg)"><path d="M12 3l7 8h-4v10H9V11H5z"/></svg>`;
}

function setMobilePauseIcon(btn) {
  if (!btn) return;
  btn.innerHTML = '<svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
}

function ensureMobileControls() {
  let controls = document.getElementById("mobile-controls");
  let pauseBtn = document.getElementById("mobile-pause-btn");

  if (!pauseBtn) {
    pauseBtn = document.createElement("button");
    pauseBtn.id = "mobile-pause-btn";
    setMobilePauseIcon(pauseBtn);
    pauseBtn.setAttribute("aria-label", "Pause oder Fortsetzen");
    const pauseHandler = (e) => {
      e.preventDefault();
      e.stopPropagation();
      handlePauseToggleInput();
    };
    pauseBtn.addEventListener("pointerdown", pauseHandler);
    pauseBtn.addEventListener("touchstart", pauseHandler, { passive: false });
    document.body.appendChild(pauseBtn);
  }

  if (!controls) {
    controls = document.createElement("div");
    controls.id = "mobile-controls";

    const dpad = document.createElement("div");
    dpad.id = "mobile-dpad";

    const upBtn = document.createElement("button");
    upBtn.id = "mobile-up";
    upBtn.className = "mobile-btn";
    upBtn.setAttribute("aria-label", "Nach oben");
    setMobileArrowIcon(upBtn, "up");

    const leftBtn = document.createElement("button");
    leftBtn.id = "mobile-left";
    leftBtn.className = "mobile-btn";
    leftBtn.setAttribute("aria-label", "Nach links");
    setMobileArrowIcon(leftBtn, "left");

    const downBtn = document.createElement("button");
    downBtn.id = "mobile-down";
    downBtn.className = "mobile-btn";
    downBtn.setAttribute("aria-label", "Nach unten");
    setMobileArrowIcon(downBtn, "down");

    const rightBtn = document.createElement("button");
    rightBtn.id = "mobile-right";
    rightBtn.className = "mobile-btn";
    rightBtn.setAttribute("aria-label", "Nach rechts");
    setMobileArrowIcon(rightBtn, "right");

    dpad.appendChild(upBtn);
    dpad.appendChild(leftBtn);
    dpad.appendChild(downBtn);
    dpad.appendChild(rightBtn);

    controls.appendChild(dpad);
    document.body.appendChild(controls);

    attachMobileDirectionButton(upBtn, { x: 0, y: -1 });
    attachMobileDirectionButton(leftBtn, { x: -1, y: 0 });
    attachMobileDirectionButton(downBtn, { x: 0, y: 1 });
    attachMobileDirectionButton(rightBtn, { x: 1, y: 0 });

  }

  const mobileMode = isMobileControlsMode();
  controls.classList.toggle("is-visible", mobileMode);
  controls.style.display = mobileMode ? "flex" : "none";
  if (pauseBtn) pauseBtn.style.display = mobileMode ? "flex" : "none";
  document.body.classList.toggle("mobile-controls-active", mobileMode);
  document.body.classList.toggle("mobile-mode", mobileMode);

  const menuStartBtn = document.getElementById('dom-mobile-start-play');
  if (menuStartBtn) menuStartBtn.style.display = (mobileMode && !started) ? 'block' : 'none';
}

/* =======================
   Auto-Scale (passt ins Browserfenster)
======================= */
function applyCanvasScale() {
  const canvas = document.querySelector("canvas");
  if (!canvas) return;

  const PAD = 24; // side padding to keep some breathing room
  const layout = getLayoutReservedSpace();
  // compute logical canvas size from grid settings to avoid depending on kaboom helpers
  const canvasW = (typeof cols !== 'undefined' ? cols * (typeof cell !== 'undefined' ? cell : 26) : width());
  const canvasH = (typeof rows !== 'undefined' ? rows * (typeof cell !== 'undefined' ? cell : 26) : height());
  const scaleBaseW = Math.max(80, window.innerWidth - PAD);
  const scaleBaseH = Math.max(80, window.innerHeight - PAD - layout.top - layout.bottom);
  const scale = Math.min(scaleBaseW / canvasW, scaleBaseH / canvasH, 1);
  // vertical offset to nudge the entire playfield vertically (pixels)
  // positive → move down, negative → move up
  const CANVAS_OFFSET_Y = isMobileControlsMode() ? 0 : 22;

  // ensure a wrapper exists to center the canvas reliably
  let wrap = document.getElementById("canvas-wrap");
  if (!wrap) {
    wrap = document.createElement("div");
    wrap.id = "canvas-wrap";
    wrap.style.position = "fixed";
    wrap.style.left = "0";
    wrap.style.right = "0";
    wrap.style.display = "flex";
    wrap.style.justifyContent = "center";
    wrap.style.alignItems = "center";
    wrap.style.pointerEvents = "auto";
    wrap.style.zIndex = "2";
    // insert wrapper before canvas
    canvas.parentNode.insertBefore(wrap, canvas);
  }
  wrap.style.top = `${layout.top}px`;
  wrap.style.bottom = `${layout.bottom}px`;
  // move canvas into wrapper (if not already)
  if (canvas.parentNode !== wrap) wrap.appendChild(canvas);

  canvas.style.position = "relative";
  canvas.style.left = "";
  canvas.style.margin = "0";
  canvas.style.transformOrigin = "center center";
  canvas.style.transform = `translateY(${CANVAS_OFFSET_Y}px) scale(${scale})`;
}
window.addEventListener("resize", () => {
  ensureMobileControls();
  applyResponsiveDomFonts();
  applyResponsiveUiLayout();
  applyCanvasScale();
});
window.addEventListener("orientationchange", () => {
  ensureMobileControls();
  applyResponsiveDomFonts();
  applyResponsiveUiLayout();
  applyCanvasScale();
});
// initial apply
ensureMobileControls();
applyResponsiveDomFonts();
applyResponsiveUiLayout();
applyCanvasScale();

function applyResponsiveDomFonts() {
  const hud = document.getElementById('dom-hud');
  if (hud) hud.style.fontSize = `${getResponsiveTextSize(16, 11)}px`;

  const pauseOverlay = document.getElementById('dom-pause-overlay');
  if (pauseOverlay) {
    const title = pauseOverlay.querySelector('div > div');
    if (title) title.style.fontSize = `${getResponsiveTextSize(28, 18)}px`;
  }

  const helpStart = document.getElementById('dom-help-btn-start');
  if (helpStart) helpStart.style.fontSize = `${getResponsiveTextSize(20, 13)}px`;

  const mobileStart = document.getElementById('dom-mobile-start-play');
  if (mobileStart) mobileStart.style.fontSize = `${getResponsiveTextSize(14, 11)}px`;
}

function applyResponsiveUiLayout() {
  const mobile = isMobileControlsMode();

  const uiBar = document.getElementById('ui-bar');
  if (uiBar) {
    if (mobile) {
      uiBar.style.top = '6px';
      uiBar.style.width = `min(${getResponsiveUiSize(720, 320)}px, 96%)`;
      uiBar.style.height = `${getResponsiveUiSize(70, 56)}px`;
      uiBar.style.borderRadius = `${getResponsiveUiSize(12, 8)}px`;
      uiBar.style.display = 'grid';
      uiBar.style.gridTemplateColumns = 'minmax(110px, 44%) 1fr';
      uiBar.style.alignItems = 'center';
      uiBar.style.columnGap = `${getResponsiveUiSize(8, 4)}px`;
      uiBar.style.padding = `0 ${getResponsiveUiSize(8, 4)}px`;
    } else {
      uiBar.style.top = '8px';
      uiBar.style.width = 'min(720px, 90%)';
      uiBar.style.height = '48px';
      uiBar.style.borderRadius = '8px';
      uiBar.style.display = 'flex';
      uiBar.style.gridTemplateColumns = '';
      uiBar.style.columnGap = '';
      uiBar.style.padding = '';
    }
  }

  const nameWrap = document.getElementById('dom-name-wrap');
  if (nameWrap && nameWrap.parentNode && nameWrap.parentNode.id === 'ui-bar') {
    nameWrap.style.marginLeft = mobile ? '0' : '12px';
    nameWrap.style.gap = `${getResponsiveUiSize(4, 2)}px`;
    nameWrap.style.marginRight = mobile ? '0' : 'auto';
    nameWrap.style.minWidth = mobile ? '0' : '';
    const label = nameWrap.querySelector('div');
    if (label) label.style.fontSize = `${getResponsiveTextSize(11, 9)}px`;
    const input = document.getElementById('dom-player-name');
    if (input) {
      input.style.width = `${getResponsiveUiSize(160, 104)}px`;
      input.style.fontSize = `${getResponsiveTextSize(12, 9)}px`;
      input.style.padding = `${getResponsiveUiSize(6, 4)}px ${getResponsiveUiSize(8, 6)}px`;
    }
  }

  const hud = document.getElementById('dom-hud');
  if (hud) {
    hud.style.textAlign = mobile ? 'right' : 'center';
    hud.style.whiteSpace = mobile ? 'pre-line' : 'nowrap';
    hud.style.lineHeight = mobile ? '1.25' : '1';
    hud.style.justifySelf = mobile ? 'end' : '';
  }

  const helpStart = document.getElementById('dom-help-btn-start');
  if (helpStart) {
    helpStart.style.width = `${getResponsiveUiSize(44, 34)}px`;
    helpStart.style.height = `${getResponsiveUiSize(44, 34)}px`;
    if (mobile && uiBar) {
      const barRect = uiBar.getBoundingClientRect();
      const pauseSize = Math.round(getResponsiveUiSize(54, 46));
      const gap = 8;
      helpStart.style.top = `${Math.round(barRect.bottom + 8)}px`;
      helpStart.style.right = `${10 + pauseSize + gap}px`;
    } else {
      helpStart.style.top = '20px';
      helpStart.style.right = '20px';
    }
  }

  const pauseBtn = document.getElementById('mobile-pause-btn');
  if (pauseBtn) {
    if (mobile) {
      const pauseSize = Math.round(getResponsiveUiSize(44, 34));
      pauseBtn.style.width = `${pauseSize}px`;
      pauseBtn.style.height = `${pauseSize}px`;

      if (helpStart) {
        const topPos = uiBar
          ? Math.round(uiBar.getBoundingClientRect().bottom + 8)
          : Math.round(8 + (window.visualViewport ? window.visualViewport.offsetTop : 0));
        const rightPos = 10;
        mobilePauseAnchor = {
          top: Math.max(6, topPos),
          right: Math.max(8, rightPos),
        };
        pauseBtn.style.setProperty('top', `${mobilePauseAnchor.top}px`, 'important');
        pauseBtn.style.setProperty('right', `${mobilePauseAnchor.right}px`, 'important');
      } else if (mobilePauseAnchor) {
        pauseBtn.style.setProperty('top', `${mobilePauseAnchor.top}px`, 'important');
        pauseBtn.style.setProperty('right', `${mobilePauseAnchor.right}px`, 'important');
      } else if (uiBar) {
        const barRect = uiBar.getBoundingClientRect();
        const fallbackTop = Math.round(barRect.bottom + 8);
        const fallbackRight = 62;
        pauseBtn.style.setProperty('top', `${Math.max(6, fallbackTop)}px`, 'important');
        pauseBtn.style.setProperty('right', `${fallbackRight}px`, 'important');
        mobilePauseAnchor = {
          top: Math.max(6, fallbackTop),
          right: fallbackRight,
        };
      } else {
        pauseBtn.style.setProperty('top', 'calc(8px + env(safe-area-inset-top, 0px))', 'important');
        pauseBtn.style.setProperty('right', '8px', 'important');
      }
    } else {
      mobilePauseAnchor = null;
      pauseBtn.style.setProperty('top', 'calc(8px + env(safe-area-inset-top, 0px))', 'important');
      pauseBtn.style.setProperty('right', '8px', 'important');
    }
  }

  const mobileStartBtn = document.getElementById('dom-mobile-start-play');
  if (mobileStartBtn) {
    const controls = document.getElementById('mobile-controls');
    if (mobile && controls && controls.classList.contains('is-visible')) {
      const ch = Math.ceil(controls.getBoundingClientRect().height);
      mobileStartBtn.style.bottom = `${ch + 26}px`;
    } else {
      mobileStartBtn.style.bottom = '220px';
    }
    mobileStartBtn.style.padding = `${getResponsiveUiSize(12, 8)}px ${getResponsiveUiSize(20, 12)}px`;
    mobileStartBtn.style.borderRadius = `${getResponsiveUiSize(10, 8)}px`;
    mobileStartBtn.style.maxWidth = mobile ? '84%' : '';
  }

  const mobileControls = document.getElementById('mobile-controls');
  if (mobileControls && mobile) {
    mobileControls.style.width = `min(${getResponsiveUiSize(560, 280)}px, calc(100% - 12px))`;
    mobileControls.style.gap = `${getResponsiveUiSize(12, 8)}px`;
  }

  const pausePanel = document.querySelector('#dom-pause-overlay > div');
  if (pausePanel) {
    pausePanel.style.width = mobile ? `min(${getResponsiveUiSize(640, 300)}px, 92%)` : 'min(640px,90%)';
    pausePanel.style.padding = `${getResponsiveUiSize(18, 12)}px`;
    pausePanel.style.borderRadius = `${getResponsiveUiSize(10, 8)}px`;
  }

  const gameOverPanel = document.querySelector('#dom-gameover-overlay > div');
  if (gameOverPanel) {
    gameOverPanel.style.width = mobile ? `min(${getResponsiveUiSize(640, 300)}px, 92%)` : 'min(640px,90%)';
    gameOverPanel.style.padding = `${getResponsiveUiSize(20, 12)}px`;
    gameOverPanel.style.borderRadius = `${getResponsiveUiSize(10, 8)}px`;
  }

  const helpPanel = document.querySelector('#dom-help-overlay > div');
  if (helpPanel) {
    helpPanel.style.width = mobile ? `min(${getResponsiveUiSize(760, 320)}px, 94%)` : 'min(760px,92%)';
    helpPanel.style.padding = `${getResponsiveUiSize(18, 12)}px`;
    helpPanel.style.borderRadius = `${getResponsiveUiSize(10, 8)}px`;
  }
}

// Digitas logo sprite handling
let digitasLoaded = false;
const digitasSpriteName = "digitas_logo";
const digitasSpritePath = "./image.png";

// Anzahl Äpfel bis ein Tile gesperrt wird: zufällig 1..3
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

let blockedMeta = new Map();

function markBlockedVisualDirty() {
  blockedVisualDirty = true;
}

// weighted random chooser: weights array of numbers summing arbitrary -> returns index
function randWeighted(weights) {
  const s = weights.reduce((a,b) => a + b, 0);
  let r = Math.random() * s;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

// Determine lock interval delta based on current score
function lockDeltaForScore() {
  try {
    if (score >= 25) return 1; // from 25 every apple creates a lock (handled specially)
    if (score >= 20) return randInt(1, 1); // effectively 1 round
    if (score >= 15) return randInt(1, 2);
    if (score >= 10) return randInt(1, 3);
    return randInt(1, 4);
  } catch (e) { return randInt(1, 3); }
}

function setBlockedTile(x, y, type = null) {
  const k = key(x, y);
  blocked.add(k);
  markBlockedVisualDirty();
  if (type === null) {
    // ausgewogene Variante: Mossy 40%, Debris 40%, Bolted 20% (Rune ausgeschlossen)
    const idx = randWeighted([0.4, 0.4, 0.2]);
    const map = [0, 1, 3];
    type = map[idx];
  }
  const baseOx = (Math.random() - 0.5) * 4;
  const baseOy = (Math.random() - 0.5) * 4;
  const meta = { type, phase: Math.random() * Math.PI * 2, ox: baseOx, oy: baseOy };
  // precompute debris layout for debris piles to avoid per-frame randomness (prevents flicker)
  if (type === 1) {
    const S = (typeof cell !== 'undefined') ? cell : 26;
    meta.debris = [];
    for (let i = 0; i < 8; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = 1.2 + Math.random() * 3.2;
      const dist = 4 + Math.random() * (S * 0.28);
      const ox = Math.cos(ang) * dist + baseOx;
      const oy = Math.sin(ang) * dist + baseOy;
      const shade = 70 + Math.floor(Math.random() * 90);
      meta.debris.push({ ox, oy, r, shade, shape: Math.random() > 0.5 ? 'circle' : 'rect', rot: Math.random() * 1.6 - 0.8 });
    }
    meta.dust = [];
    for (let d = 0; d < 5; d++) {
      const dx = 6 + Math.random() * (S - 12) + baseOx;
      const dy = 6 + Math.random() * (S - 12) + baseOy;
      meta.dust.push({ dx, dy, r: 0.8 + Math.random() * 1.6 });
    }
  }
  // precompute rust spots for metal plates to allow subtle animation without per-frame randomness
  if (type === 3) {
    const S = (typeof cell !== 'undefined') ? cell : 26;
    meta.rust = [];
    const rustCount = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < rustCount; i++) {
      const rx = 6 + Math.random() * (S - 12) + baseOx;
      const ry = 6 + Math.random() * (S - 12) + baseOy;
      const rr = 1 + Math.random() * 3.2;
      meta.rust.push({ rx, ry, rr, tone: 60 + Math.floor(Math.random() * 80) });
    }
  }
  blockedMeta.set(k, meta);
}

function sameCell(a, b) {
  return !!a && !!b && a.x === b.x && a.y === b.y;

function manhattan(a, b) {
  if (!a || !b) return Infinity;
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}

function lerp(a, b, t) { return a + (b - a) * t; }

function ageItemAndExpire(item, dtSec, onExpired) {
  if (!item || typeof item.age !== 'number') return;
  item.age += dtSec;
  if (item.age >= 15) onExpired();
}

function randomSpawnDelay(base, jitter, minDelay, maxDelay) {
  // layered random: natural variation with occasional short/long outliers
  let d = base + randInt(-jitter, jitter) + randInt(-Math.floor(jitter * 0.45), Math.floor(jitter * 0.45));
  const roll = Math.random();
  if (roll < 0.18) d = Math.floor(d * (0.58 + Math.random() * 0.26));
  else if (roll > 0.82) d = Math.floor(d * (1.18 + Math.random() * 0.45));
  return Math.max(minDelay, Math.min(maxDelay, d));
}

function applyAntiClump(delay, lastSpawnAt, minGap) {
  if (!lastSpawnAt) return delay;
  const elapsed = Date.now() - lastSpawnAt;
  if (elapsed + delay >= minGap) return delay;
  return (minGap - elapsed) + randInt(250, 1400);
}

function spawnAppleAppearFx(cellX, cellY, rgb) {
  try {
    if (!started || gameOver) return;
    const c = Array.isArray(rgb) ? rgb : [255, 255, 255];
    const cx = cellX * cell + cell / 2;
    const cy = cellY * cell + cell / 2;
    add([
      circle(cell * 0.16),
      pos(cx, cy),
      anchor('center'),
      color(c[0], c[1], c[2]),
      opacity(0.38),
      z(Z_GAME + 5),
      {
        t: 0,
        update() {
          this.t += dt();
          this.scale = 1 + this.t * 4.2;
          try { this.opacity = Math.max(0, 0.38 - this.t * 1.6); } catch(e){}
          if (this.t > 0.26) { try { destroy(this); } catch(e){} }
        }
      }
    ]);
    add([
      circle(cell * 0.08),
      pos(cx, cy),
      anchor('center'),
      color(255, 255, 255),
      opacity(0.6),
      z(Z_GAME + 6),
      {
        t: 0,
        update() {
          this.t += dt();
          this.scale = 1 + this.t * 2.6;
          try { this.opacity = Math.max(0, 0.6 - this.t * 2.6); } catch(e){}
          if (this.t > 0.22) { try { destroy(this); } catch(e){} }
        }
      }
    ]);
  } catch(e){}
}

function spawnEatBurstFx(cellX, cellY, rgb) {

    const c = Array.isArray(rgb) ? rgb : [255, 255, 255];
    const cx = cellX * cell + cell / 2;
    const cy = cellY * cell + cell / 2;
    // center flash
    add([
      circle(cell * 0.12),
      pos(cx, cy),
      anchor('center'),
      color(255, 255, 255),
      opacity(0.8),
      z(Z_GAME + 8),
      {
        t: 0,
        update() {
          this.t += dt();
          this.scale = 1 + this.t * 3.2;
          try { this.opacity = Math.max(0, 0.8 - this.t * 4.0); } catch(e){}
          if (this.t > 0.22) { try { destroy(this); } catch(e){} }
        }
      }
    ]);
    // tiny radial particles
    const pieces = 6;
    for (let i = 0; i < pieces; i++) {
      const a = (Math.PI * 2 * i) / pieces + (Math.random() - 0.5) * 0.35;
      const sp = 34 + Math.random() * 36;
      add([
        circle(2 + Math.random() * 1.6),
        pos(cx, cy),
        anchor('center'),
        color(c[0], c[1], c[2]),
        opacity(0.95),
        z(Z_GAME + 8),
        {
          t: 0,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          update() {
            this.t += dt();
            this.pos.x += this.vx * dt();
            this.pos.y += this.vy * dt();
            this.vx *= 0.93;
            this.vy *= 0.93;
            try { this.opacity = Math.max(0, 0.95 - this.t * 3.4); } catch(e){}
            if (this.t > 0.28) { try { destroy(this); } catch(e){} }
          }
        }
      ]);
    }
  } catch(e){}
}

function spawnSnakeGameOverFx(parts) {
  try {
    if (!Array.isArray(parts) || parts.length === 0) return;
    destroyMany(['snake', 'snake_glow', 'blue_timer_head']);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (!p) continue;
      const cx = p.x * cell + cell / 2;
      const cy = p.y * cell + cell / 2;
      const isHead = i === 0;
      const dirSign = (i % 2 === 0) ? 1 : -1;
      add([
        rect(cell * 0.78, cell * 0.78, { radius: Math.max(4, Math.floor(cell * 0.18)) }),
        pos(cx, cy),
        anchor('center'),
        color(isHead ? 255 : 120, isHead ? 80 : 180, isHead ? 80 : 120),
        opacity(0.92),
        z(Z_GAME + 9),
        {
          t: 0,
          vx: (30 + i * 8) * dirSign,
          vy: -30 - i * 6,
          spin: (Math.random() * 2.2 - 1.1),
          update() {
            this.t += dt();
            this.vy += 220 * dt();
            this.pos.x += this.vx * dt();
            this.pos.y += this.vy * dt();
            try { this.angle = (this.angle || 0) + this.spin; } catch(e){}
            this.vx *= 0.985;
            try { this.opacity = Math.max(0, 0.92 - this.t * 1.9); } catch(e){}
            try { this.scale = Math.max(0.12, 1 - this.t * 0.85); } catch(e){}
            if (this.t > 0.62) { try { destroy(this); } catch(e){} }
          }
        }
      ]);
    }
    // quick head shock pulse
    const h = parts[0];
    if (h) {
      const hx = h.x * cell + cell / 2;
      const hy = h.y * cell + cell / 2;
      add([
        circle(cell * 0.2),
        pos(hx, hy),
        anchor('center'),
        color(255, 80, 80),
        opacity(0.72),
        z(Z_GAME + 10),
        {
          t: 0,
          update() {
            this.t += dt();
            this.scale = 1 + this.t * 4.6;
            try { this.opacity = Math.max(0, 0.72 - this.t * 2.9); } catch(e){}
            if (this.t > 0.34) { try { destroy(this); } catch(e){} }
          }
        }
      ]);
    }
  } catch (e) {}
}

function triggerBlueModeSwitchFx(entering) {
  try {
    if (!snake || !snake[0]) return;
    const hx = snake[0].x * cell + cell / 2;
    const hy = snake[0].y * cell + cell / 2;
    const main = entering ? [70, 150, 255] : [70, 230, 170];
    const label = entering ? 'BLUE' : 'NORMAL';
    for (let i = 0; i < 2; i++) {
      add([
        circle(cell * (0.22 + i * 0.09)),
        pos(hx, hy),
        anchor('center'),
        color(main[0], main[1], main[2]),
        opacity(0.34 - i * 0.1),
        z(Z_GAME + 7),
        {
          t: 0,
          delay: i * 0.03,
          update() {
            this.t += dt();
            if (this.t < this.delay) return;
            const tt = this.t - this.delay;
            this.scale = 1 + tt * 3.6;
            try { this.opacity = Math.max(0, (0.34 - i * 0.1) - tt * 1.5); } catch(e){}
            if (tt > 0.34) { try { destroy(this); } catch(e){} }
          }
        }
      ]);
    }
    spawnScorePopup(hx, hy - cell * 0.35, label, main);
  } catch(e){}
}

function isOpposite(a, b) {
  return a.x === -b.x && a.y === -b.y;
}
function isOnSnakeCell(x, y) {
  return snake && snake.some(p => p.x === x && p.y === y);
}

/* ✅ Äpfel dürfen NICHT auf blocked/pendingLock erscheinen */
function spawnFood() {
  while (true) {
    const candidate = {
      x: randInt(0, cols - 1),
      y: randInt(0, rows - 1),
      age: 0, // used for spawn animation
    };

    const onSnake = snake.some(part => part && part.x === candidate.x && part.y === candidate.y);
    const onBlocked = blocked.has(key(candidate.x, candidate.y));
    const onPending = pendingLock && candidate.x === pendingLock.x && candidate.y === pendingLock.y;

    if (!onSnake && !onBlocked && !onPending) {
      spawnAppleAppearFx(candidate.x, candidate.y, [220, 50, 50]);
      return candidate;
    }
  }
}

function scheduleGoldenSpawn() {
  try { if (goldenSpawnTimeout) clearTimeout(goldenSpawnTimeout); } catch(e){}
  let delay = randomSpawnDelay(GOLD_BASE_INTERVAL, GOLD_JITTER, 3500, 36000);
  delay = applyAntiClump(delay, lastGoldenSpawnAt, 7000);
  goldenSpawnTimeout = setTimeout(()=>{
    // only spawn if none exists and game is running
    if (!started || gameOver) return scheduleGoldenSpawn();
    if (goldenFood) {
      // already exists, schedule next check
      return scheduleGoldenSpawn();
    }
    // try to find a free cell
    for (let attempts=0; attempts<64; attempts++){
      const cand = { x: randInt(0, cols-1), y: randInt(0, rows-1), age: 0 };
      const onSnake = snake.some(part => part && part.x === cand.x && part.y === cand.y);
      const onBlocked = blocked.has(key(cand.x, cand.y));
      const onPending = pendingLock && cand.x === pendingLock.x && cand.y === pendingLock.y;
      if (food && cand.x === food.x && cand.y === food.y) continue;
      if (!onSnake && !onBlocked && !onPending) {
        goldenFood = cand;
        lastGoldenSpawnAt = Date.now();
        spawnAppleAppearFx(cand.x, cand.y, [230, 180, 30]);
        // schedule next spawn regardless
        scheduleGoldenSpawn();
        return;
      }
    }
    // if couldn't find, try again later
    scheduleGoldenSpawn();
  }, delay);
}

function hidePauseOverlay(){
  const el = document.getElementById('dom-pause-overlay'); if (el) el.remove();
}

let _countdownActive = false;
function startResumeCountdown(){
  if (!paused || _countdownActive) return;
  _countdownActive = true;
  let n = 3;
  const cd = document.createElement('div'); cd.id='dom-countdown-overlay';
  Object.assign(cd.style, { position:'fixed', left:0, top:0, right:0, bottom:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none', zIndex:11000 });
  const num = document.createElement('div'); num.innerText = String(n); Object.assign(num.style, { fontFamily: "'Press Start 2P',monospace", fontSize: `${getResponsiveTextSize(120, 56)}px`, color:'#fff', textAlign:'center', textShadow:'0 0 12px rgba(0,0,0,0.6)' });
  cd.appendChild(num); document.body.appendChild(cd);
  const iv = setInterval(()=>{
    n -= 1;
    if (n <= 0) {
      clearInterval(iv);
      try { cd.remove(); } catch(e){}
      hidePauseOverlay();
      paused = false;
      _countdownActive = false;
      try { document.body.focus(); } catch(e){}
      // restart spawn schedulers that were cleared on pause
      try { startSpecialSpawnTimers(); } catch(e){}
      return;
    }
    num.innerText = String(n);
  }, 1000);
}

/* =======================
   Background: Border + Grid
======================= */
function drawBorder() {
  // moosiger Steinrand: tiles entlang der sichtbaren Ränder (als Umrandung)
  const stoneSize = cell; // size of stones along the border
  const cols = Math.ceil(width() / stoneSize);
  const rows = Math.ceil(height() / stoneSize);
  // top/bottom (y inside canvas)
  for (let x = 0; x < cols; x++) {
    const sx = x * stoneSize;
    const sW = stoneSize + 4;
    const sH = sW;
      const topX = sx - 14;
      const topY = -32;
    add([
      rect(sW, sH, { radius: 8 }),
      pos(topX, topY),
      color(98, 98, 98),
      z(Z_BORDER),
      "border",
    ]);
    // subtle lighter rim so corners read as rounded and the stone lifts slightly
    add([rect(sW + 2, sH + 2, { radius: 8 }), pos(topX - 1, topY - 1), color(140, 140, 140), opacity(0.06), z(Z_BORDER + 1), "border"]);
    if (Math.random() > 0.35) {
      const mx = topX + 4 + Math.random() * (sW - 8);
      const my = topY + 4 + Math.random() * (sH - 8);
      add([
        circle(4 + Math.random() * 4),
        pos(mx, my),
        color(30, 140, 30),
        z(Z_BORDER + 1),
        "border",
      ]);
    }
      const botX = sx - 14;
      const botY = height() - stoneSize + 32;
    add([
      rect(sW, sH, { radius: 8 }),
      pos(botX, botY),
      color(98, 98, 98),
      z(Z_BORDER),
      "border",
    ]);
    add([rect(sW + 2, sH + 2, { radius: 8 }), pos(botX - 1, botY - 1), color(140, 140, 140), opacity(0.06), z(Z_BORDER + 1), "border"]);
    if (Math.random() > 0.35) {
      const mx = botX + 4 + Math.random() * (sW - 8);
      const my = botY + 4 + Math.random() * (sH - 8);
      add([
        circle(4 + Math.random() * 4),
        pos(mx, my),
        color(30, 140, 30),
        z(Z_BORDER + 1),
        "border",
      ]);
    }
  }
  // left/right
  for (let y = 0; y < rows; y++) {
    const sy = y * stoneSize;
    const sW = stoneSize + 4;
    const sH = sW;
      const leftX = -32;
      const leftY = sy - 14;
    add([
      rect(sW, sH, { radius: 8 }),
      pos(leftX, leftY),
      color(98, 98, 98),
      z(Z_BORDER),
      "border",
    ]);
    add([rect(sW + 2, sH + 2, { radius: 8 }), pos(leftX - 1, leftY - 1), color(140, 140, 140), opacity(0.06), z(Z_BORDER + 1), "border"]);
    if (Math.random() > 0.35) {
      const mx = leftX + 4 + Math.random() * (sW - 8);
      const my = leftY + 4 + Math.random() * (sH - 8);
      add([
        circle(4 + Math.random() * 4),
        pos(mx, my),
        color(30, 140, 30),
        z(Z_BORDER + 1),
        "border",
      ]);
    }
      const rightX = width() - stoneSize + 32;
      const rightY = sy - 14;
    add([
      rect(sW, sH, { radius: 8 }),
      pos(rightX, rightY),
      color(98, 98, 98),
      z(Z_BORDER),
      "border",
    ]);
    add([rect(sW + 2, sH + 2, { radius: 8 }), pos(rightX - 1, rightY - 1), color(140, 140, 140), opacity(0.06), z(Z_BORDER + 1), "border"]);

/* =======================
   Locked Tile Drawing Helper
======================= */
function drawLockedTile(type, px, py, size, meta) {
  const phase = (meta && meta.phase) || 0;
  // ensure sensible defaults
  meta = meta || {};
  switch (type) {
    case 0: // Mossy Stone
      add([rect(size, size, { radius: 6 }), pos(px, py), color(110, 100, 90), z(Z_OBS), "obs"]);
      add([rect(size - 6, size - 6, { radius: 4 }), pos(px + 3, py + 3), color(140, 130, 120), opacity(0.9), z(Z_OBS + 1), "obs"]);
      {
        // erhöhte Moosdichte: mehr Patches für stärker bewachsene Steine
        const moss = [
          [6, 6], [size - 8, 8], [8, size - 8], [size - 10, size - 6],
          [Math.floor(size * 0.5), 10], [12, Math.floor(size * 0.6)], [size - 14, Math.floor(size * 0.55)], [Math.floor(size * 0.25), size - 12]
        ];
        for (let i = 0; i < moss.length; i++) {
          const [dx, dy] = moss[i];
          const r = 2.2 + ((i + 1) * 0.5);
          const a = 0.4 + Math.sin(elapsed * 0.45 + phase + i) * 0.04;
          add([circle(r), pos(px + dx + (meta.ox || 0), py + dy + (meta.oy || 0)), color(58, 160, 72), opacity(Math.max(0.25, a)), z(Z_OBS + 2), "obs"]);
        }
      }
      break;

    case 1: // Debris Pile (Schutthaufen)
      // base slab under rubble
      add([rect(size, size, { radius: 5 }), pos(px, py), color(140, 135, 130), z(Z_OBS), "obs"]);
      add([rect(size - 8, size - 8, { radius: 4 }), pos(px + 4, py + 4), color(120, 115, 110), opacity(0.96), z(Z_OBS + 1), "obs"]);
      // clustered rubble pieces
      if (meta && meta.debris) {
        for (const piece of meta.debris) {
          if (piece.shape === 'circle') {
            add([circle(piece.r), pos(px + size / 2 + piece.ox, py + size / 2 + piece.oy), color(piece.shade, piece.shade, piece.shade), opacity(0.92), z(Z_OBS + 2), "obs"]);
          } else {
            add([rect(piece.r * 1.2, piece.r * 0.8, { radius: 1 }), pos(px + size / 2 + piece.ox, py + size / 2 + piece.oy), anchor('center'), rotate(piece.rot), color(piece.shade + 10, piece.shade + 8, piece.shade + 6), opacity(0.92), z(Z_OBS + 2), "obs"]);
          }
        }
      }
      // a few small debris clusters and dust (deterministic if available)
      if (meta && meta.dust) {
        for (const d of meta.dust) {
          add([circle(d.r), pos(px + d.dx, py + d.dy), color(90, 90, 88), opacity(0.88), z(Z_OBS + 1), "obs"]);
        }
      }
      break;

    case 2: // Rune Tile (more broken/kaputt)
      // base plate + inner worn patch
      add([rect(size, size, { radius: 4 }), pos(px, py), color(70, 80, 85), z(Z_OBS), "obs"]);
      add([rect(size - 8, size - 8, { radius: 3 }), pos(px + 4, py + 4), color(60, 68, 72), opacity(0.95), z(Z_OBS + 1), "obs"]);
      // chipped corners (small darker chips and debris)
      add([rect(6, 6), pos(px + 1, py + 1), color(40, 42, 45), opacity(0.95), z(Z_OBS + 2), "obs"]);
      add([rect(6, 6), pos(px + size - 7, py + 1), color(40, 42, 45), opacity(0.95), z(Z_OBS + 2), "obs"]);
      add([rect(6, 6), pos(px + 1, py + size - 7), color(40, 42, 45), opacity(0.95), z(Z_OBS + 2), "obs"]);
      // jagged rune strokes (many small segments to feel carved and uneven)
      const glowAlpha = 0.18 + Math.sin(elapsed * 2.2 + phase) * 0.12;
      const strokes = [
        { x: px + size * 0.22, y: py + size * 0.35, dx: size * 0.52, dy: 0 },
        { x: px + size * 0.48, y: py + size * 0.18, dx: 0, dy: size * 0.54 },
        { x: px + size * 0.28, y: py + size * 0.52, dx: size * 0.36, dy: size * 0.22 },
      ];
      for (let si = 0; si < strokes.length; si++) {
        const st = strokes[si];
        const segs = 8;
        for (let s = 0; s < segs; s++) {
          const t = s / (segs - 1);
          const jitterX = Math.sin(phase * 1.3 + s * 1.7 + si) * 1.6;
          const jitterY = Math.cos(phase * 1.1 + s * 1.9 + si) * 1.2;
          const sx = st.x + st.dx * t + jitterX + (meta && meta.ox || 0);
          const sy = st.y + st.dy * t + jitterY + (meta && meta.oy || 0);
          add([rect(2, 2), pos(sx, sy), color(110, 230, 180), opacity(glowAlpha), z(Z_OBS + 3), "obs"]);
        }
      }
      // cracks: thin light line + darker offset for depth
      for (let c = 0; c < 2; c++) {
        const cx = px + (c === 0 ? 8 : size - 8) + (meta && meta.ox || 0);
        const cy = py + size * 0.25 + c * (size * 0.25) + (meta && meta.oy || 0);
        add([rect(1, size * 0.5), pos(cx, cy), anchor('center'), rotate(0.25 * (c ? -1 : 1)), color(220, 220, 220), opacity(0.9), z(Z_OBS + 2), "obs"]);
        add([rect(1, size * 0.5), pos(cx + 1.4, cy + 1.4), anchor('center'), rotate(0.25 * (c ? -1 : 1)), color(40, 36, 34), opacity(0.9), z(Z_OBS + 1), "obs"]);
        // a few debris dots near cracks
        for (let d = 0; d < 3; d++) {
          const dx = cx + (Math.random() - 0.5) * 12;
          const dy = cy + (Math.random() - 0.5) * 12;
          add([circle(1 + Math.random() * 1.6), pos(dx, dy), color(48, 50, 52), opacity(0.9), z(Z_OBS + 2), "obs"]);
        }
      }
      break;

    case 3: // Bolted Metal Plate (rustier, static)
      // heavier rusted metal base (flatter, more orange-brown)
      add([rect(size, size, { radius: 3 }), pos(px, py), color(90, 70, 56), z(Z_OBS), "obs"]);
      // inner plate darker, desaturated
      add([rect(size - 6, size - 6, { radius: 2 }), pos(px + 3, py + 3), color(100, 80, 66), opacity(0.96), z(Z_OBS + 1), "obs"]);
      // bolts at corners (clear, static)
      const boltR = 3.0;
      const boltColorOuter = color(140, 120, 100);
      const boltColorInner = color(90, 70, 52);
      add([circle(boltR), pos(px + 6, py + 6), boltColorOuter, z(Z_OBS + 3), "obs"]);
      add([circle(boltR * 0.7), pos(px + 6, py + 6), boltColorInner, z(Z_OBS + 4), "obs"]);
      add([circle(boltR), pos(px + size - 6, py + 6), boltColorOuter, z(Z_OBS + 3), "obs"]);
      add([circle(boltR * 0.7), pos(px + size - 6, py + 6), boltColorInner, z(Z_OBS + 4), "obs"]);
      add([circle(boltR), pos(px + 6, py + size - 6), boltColorOuter, z(Z_OBS + 3), "obs"]);
      add([circle(boltR * 0.7), pos(px + 6, py + size - 6), boltColorInner, z(Z_OBS + 4), "obs"]);
      add([circle(boltR), pos(px + size - 6, py + size - 6), boltColorOuter, z(Z_OBS + 3), "obs"]);
      add([circle(boltR * 0.7), pos(px + size - 6, py + size - 6), boltColorInner, z(Z_OBS + 4), "obs"]);
      // static rust spots: use precomputed `meta.rust` (set in setBlockedTile) so spots don't move
      if (meta && meta.rust) {
        for (const rs of meta.rust) {
          add([circle(rs.rr), pos(px + rs.rx, py + rs.ry), color(150, 75, 36), opacity(0.86), z(Z_OBS + 2), "obs"]);
          if (rs.streak) add([rect(rs.streak.w || 1, rs.streak.h || 6), pos(px + rs.rx - 2, py + rs.ry - 4), rotate(rs.streak.rot || 0), color(130, 60, 30), opacity(0.6), z(Z_OBS + 2), "obs"]);
        }
      } else {
        // fallback: generate static rust spots and save to meta to avoid per-frame randomness
        meta.rust = [];
        const rustCount = 5 + Math.floor(Math.random() * 4);
        for (let i = 0; i < rustCount; i++) {
          const rx = 6 + Math.random() * (size - 12) + (meta && meta.ox || 0);
          const ry = 6 + Math.random() * (size - 12) + (meta && meta.oy || 0);
          const rsz = 1.8 + Math.random() * 4.2;
          const streak = Math.random() > 0.5 ? { w: 1 + Math.random() * 2, h: 4 + Math.random() * 10, rot: (Math.random() - 0.5) * 0.6 } : null;
          meta.rust.push({ rx, ry, rr: rsz, streak });
          add([circle(rsz), pos(px + rx, py + ry), color(150, 75, 36), opacity(0.86), z(Z_OBS + 2), "obs"]);
          if (streak) add([rect(streak.w, streak.h), pos(px + rx - 2, py + ry - 4), rotate(streak.rot), color(130, 60, 30), opacity(0.6), z(Z_OBS + 2), "obs"]);
        }
      }
      // subtle overall darken to suggest oxidation (static)
      add([rect(size * 0.92, size * 0.92), pos(px + size * 0.04, py + size * 0.04), color(70, 52, 40), opacity(0.08), z(Z_OBS + 1), "obs"]);
      // small static specular streak for depth (very faint)
      add([rect(size * 0.22, 5), pos(px + size * 0.52, py + size * 0.18), color(255, 255, 255), opacity(0.06), rotate(-0.28), z(Z_OBS + 3), "obs"]);
      break;
  }
}
function drawGrid() {
  // slightly green grid to sit above the meadow

}

/* =======================
   Hindernisse planen: alle N Items
======================= */
function scheduleLockCell() {
  if (pendingLock) return; // nur eins gleichzeitig

  const head = snake[0];
  const tries = 600;

  for (let i = 0; i < tries; i++) {
    const x = randInt(0, cols - 1);
    const y = randInt(0, rows - 1);

    if (isOnSnakeCell(x, y)) continue;
    if (food && food.x === x && food.y === y) continue;
    if (goldenFood && goldenFood.x === x && goldenFood.y === y) continue;
    if (blueFood && blueFood.x === x && blueFood.y === y) continue;
    if (greenFood && greenFood.x === x && greenFood.y === y) continue;
    if (blocked.has(key(x, y))) continue;

    // nicht zu nah am Kopf
    if (manhattan({x,y}, head) < minDistHead) continue;

    // nicht zu nah an der Snake
    let tooClose = false;
    for (const seg of snake) {
      if (manhattan({x,y}, seg) < minDistBody) { tooClose = true; break; }
    }
    if (tooClose) continue;

    pendingLock = { x, y, t: 0 };
    return;
  }
  
}

// try to place a blocked tile immediately using the same constraints as scheduleLockCell
function placeBlockedImmediate() {
  
  const head = snake[0];
  const tries = 600;
  if (pendingLock) return false;
  for (let i = 0; i < tries; i++) {
    const x = randInt(0, cols - 1);
    const y = randInt(0, rows - 1);
    if (isOnSnakeCell(x, y)) continue;
    if (food && food.x === x && food.y === y) continue;
    if (blocked.has(key(x, y))) continue;
    if (pendingLock && pendingLock.x === x && pendingLock.y === y) continue;
    if (manhattan({ x, y }, head) < minDistHead) continue;
    let tooClose = false;
    for (const seg of snake) {
      if (manhattan({ x, y }, seg) < minDistBody) { tooClose = true; break; }
    }
    if (tooClose) continue;
    // instead of setting the blocked tile immediately, create a pendingLock
    pendingLock = { x, y, t: 0 };
    return true;
  }
  
  return false;
}

/* =======================
   Render Game (inkl. Blocks + Warning)
======================= */
function drawGame(alpha = 1) {
  destroyMany(["snake", "snake_glow", "blue_timer_head", "food", "bluefood_glow", "goldfood", "warn"]);

  // Blocked tiles are static visuals: redraw only when changed.
  if (blockedVisualDirty) {
    destroyAllSafe("obs");
    for (const k of blocked) {
      const meta = blockedMeta.get(k);
      const [x, y] = k.split(",").map(Number);
      const px = x * cell;
      const py = y * cell;
      drawLockedTile((meta && meta.type) || 0, px, py, cell, meta);
    }
    blockedVisualDirty = false;
  }

  // PendingLock Warnung (gelb blinkend)
  if (pendingLock) {
    const alpha = (Math.sin(pendingLock.t * 10) > 0) ? 0.95 : 0.2;
    add([
      rect(cell, cell, { radius: 6 }),
      pos(pendingLock.x * cell, pendingLock.y * cell),
      color(255, 190, 0),
      opacity(alpha),
      z(Z_OBS + 2),
      "warn",
    ]);
  }

  // Leafy Snake: two-tone segments with slight overlap
  const snakeRadius = Math.max(6, Math.floor(cell * 0.22));
  for (let i = 0; i < snake.length; i++) {
    const cur = snake[i];
    const prev = (prevSnake && prevSnake[i]) ? prevSnake[i] : cur;
    const ix = lerp(prev.x, cur.x, alpha);
    const iy = lerp(prev.y, cur.y, alpha);
    const px = ix * cell;
    const py = iy * cell;

    const baseCol = blueActive ? ((i === 0) ? [20, 80, 200] : [40, 120, 220]) : ((i === 0) ? [22, 120, 22] : [28, 140, 28]);
    const highlight = blueActive ? ((i === 0) ? [140, 200, 255] : [120, 210, 255]) : ((i === 0) ? [120, 220, 120] : [100, 210, 100]);

    // subtle blue glow behind segment when active
    if (blueActive) {
      try {
        add([
          rect(cell + 8, cell + 8, { radius: snakeRadius + 3 }),
          pos(px - 4, py - 4),
          color(60, 140, 220),
          opacity(0.18),
          z(Z_GAME - 1),
          "snake_glow",
        ]);
      } catch(e){}
    }

    // base rounded segment
    add([
      rect(cell, cell, { radius: snakeRadius }),
      pos(px, py),
      color(baseCol[0], baseCol[1], baseCol[2]),
      z(Z_GAME),
      "snake",
    ]);

    // subtle leaf highlight (smaller rounded rect, offset)
    add([
      rect(cell - 6, cell - 6, { radius: snakeRadius - 2 }),
      pos(px + 3, py + 2),
      color(highlight[0], highlight[1], highlight[2]),
      opacity(0.85),
      z(Z_GAME + 1),
      "snake",
    ]);

    // draw Digitas logo (if loaded) or unicorn glyph on each segment when blue mode is active
    if (blueActive) {
      try {
        if (digitasLoaded) {
          // draw loaded sprite centered in the cell; scale to fit perfectly (70% of cell size)
          // Original logo is 64x64px, scale to 70% of cell for perfect fit
          const targetSize = cell * 0.7;
          const sx = targetSize / 64; // scale based on original 64px logo
          add([
            sprite(digitasSpriteName),
            pos(px + cell / 2, py + cell / 2),
            anchor('center'),
            scale(sx),
            z(Z_GAME + 4),
            'snake',
          ]);
        } else {
          const ux = px + cell * 0.22; // unicorn offset inside cell
          const uy = py + cell * 0.28;
          const us = Math.max(6, Math.floor(cell * 0.28)); // base size
          // head (small circle)
          add([circle(us * 0.45), pos(ux, uy), anchor('center'), color(240, 248, 255), z(Z_GAME + 3), 'snake']);
          // horn (thin rotated rect)
          add([rect(2, us * 0.9, { radius: 1 }), pos(ux + us * 0.32, uy - us * 0.6), color(180, 220, 255), anchor('center'), rotate(-0.9), z(Z_GAME + 4), 'snake']);
          // mane tuft (small rotated rect)
          add([rect(us * 0.5, 2, { radius: 1 }), pos(ux - us * 0.08, uy - us * 0.28), color(120, 200, 255), anchor('center'), rotate(-0.6), z(Z_GAME + 4), 'snake']);
        }
      } catch (e) {}
    }

    // head: small leaf ears
    if (i === 0) {
      add([
        rect(6, 12, { radius: 3 }),
        pos(px + cell / 2 - 10, py + 6),
        color(highlight[0], highlight[1], highlight[2]),
        anchor("center"),
        z(Z_GAME + 2),
        rotate(-0.6),
        "snake",
      ]);
      add([
        rect(6, 12, { radius: 3 }),
        pos(px + cell / 2 + 10, py + 6),
        color(highlight[0], highlight[1], highlight[2]),
        anchor("center"),
        z(Z_GAME + 2),
        rotate(0.6),
        "snake",
      ]);
      // show blue effect countdown above head (pixel font)
      if (blueActive) {
        try {
          add([
            text(String(Math.ceil(blueRemaining)), { size: 18, font: 'pixel' }),
            pos(px + cell / 2, py - cell * 0.22),
            anchor('center'),
            color(10, 60, 140),
            z(Z_UI + 6),
            'blue_timer_head',
          ]);
        } catch(e){}
      }
    }
  }

  // Food (komplett rund) mit kurzer Spawn-Animation
  if (food) {
    const animDur = 0.12;
    const t = Math.min(1, (food && typeof food.age === 'number' ? food.age : animDur) / animDur);
    const s = t * t * (3 - 2 * t); // smoothstep
    const cx = food.x * cell + cell / 2;
    const cy = food.y * cell + cell / 2;
    const baseR = cell / 2 - 2;
    // base red apple
    add([
      circle(baseR),
      pos(cx, cy),
      anchor("center"),
      scale(s),
      color(200, 30, 30),
      z(Z_GAME),
      "food",
    ]);
    // highlight
    add([
      circle(baseR * 0.28),
      pos(cx - baseR * 0.32, cy - baseR * 0.36),
      anchor("center"),
      scale(s),
      color(255, 220, 200),
      opacity(0.9),
      z(Z_GAME + 1),
      "food",
    ]);

/* =======================

// --- Leaderboard / localStorage ---
const LB_KEY = 'snake_leaderboard_v1';
const LB_MAX = 10;
let currentPlayerName = 'Player';
let lastSavedEntry = null;

function clearLeaderboard() {
  try { localStorage.removeItem(LB_KEY); } catch(e) {}
}

function normalizeLeaderboardEntry(raw) {
  const src = (raw && typeof raw === 'object') ? raw : {};
  const srcStats = (src.stats && typeof src.stats === 'object') ? src.stats : {};
  const readNum = (v, fallback = 0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  };
  return {
    name: String(src.name || 'Player').slice(0, 16),
    score: readNum(src.score, 0),
    ts: readNum(src.ts, Date.now()),
    playedSec: Math.max(0, Math.floor(readNum(src.playedSec, 0))),
    stats: {
      applesNormal: Math.max(0, Math.floor(readNum(srcStats.applesNormal, src.applesNormalCount))),
      applesGolden: Math.max(0, Math.floor(readNum(srcStats.applesGolden, src.applesGoldenCount))),
      applesBlue: Math.max(0, Math.floor(readNum(srcStats.applesBlue, src.applesBlueCount))),
      applesGreen: Math.max(0, Math.floor(readNum(srcStats.applesGreen, src.applesGreenCount))),
      blockedEatenBlue: Math.max(0, Math.floor(readNum(srcStats.blockedEatenBlue, src.blockedEatenDuringBlue))),
    },
  };
}

function formatPlayedTime(totalSec) {
  const s = Math.max(0, Math.floor(Number(totalSec) || 0));
  const mm = Math.floor(s / 60).toString().padStart(2, '0');
  const ss = (s % 60).toString().padStart(2, '0');
  return `${mm}:${ss}`;
}

function buildLeaderboardTable(list, opts = {}) {
  const maxCols = Math.max(3, Math.min(LB_MAX, Number(opts.maxCols) || LB_MAX));
  const tableFont = Math.max(6, Number(opts.fontSize) || 7);
  const compact = !!opts.compact;
  const table = document.createElement('table');
  table.style.width = '100%';
  table.style.tableLayout = 'fixed';
  table.style.borderCollapse = 'collapse';
  table.style.fontFamily = "'Press Start 2P',monospace";
  table.style.fontSize = `${tableFont}px`;
  table.style.lineHeight = '1.1';

  const medalBg = ['rgba(255,215,0,0.16)', 'rgba(192,192,192,0.16)', 'rgba(205,127,50,0.16)'];
  const medalBorder = ['#ffd700', '#c0c0c0', '#cd7f32'];
  const cols = [
    { label: '#', get: (_it, idx) => String(idx + 1) },
    { label: 'name', get: (it) => it ? it.name : '-' },
    { label: 'score', get: (it) => it ? String(it.score) : '-' },
    { label: 'time', get: (it) => it ? formatPlayedTime(it.playedSec) : '-' },
    { label: 'red', get: (it) => it ? String(it.stats.applesNormal) : '-' },
    { label: 'gold', get: (it) => it ? String(it.stats.applesGolden) : '-' },
    { label: 'green', get: (it) => it ? String(it.stats.applesGreen) : '-' },
    { label: 'wall', get: (it) => it ? String(it.stats.blockedEatenBlue) : '-' },
  ];

  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  for (let i = 0; i < cols.length; i++) {
    const th = document.createElement('th');
    th.innerText = cols[i].label;
    th.style.textAlign = 'center';
    th.style.padding = '2px 2px';
    th.style.border = '1px solid rgba(255,255,255,0.2)';
    th.style.minWidth = '0';
    if (i === 0) {
      th.style.background = 'rgba(255,255,255,0.1)';
      th.style.color = '#ffd27a';
      th.style.fontWeight = 'bold';
    } else {
      th.style.background = 'rgba(255,255,255,0.05)';
      th.style.color = '#dbe9ff';
    }
    if (i === 1) {
      th.style.width = compact ? '76px' : '104px';
      th.style.maxWidth = compact ? '76px' : '104px';
      th.style.textAlign = 'left';
    }
    trHead.appendChild(th);
  }
  thead.appendChild(trHead);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (let i = 0; i < maxCols; i++) {
    const entry = list[i] || null;
    const tr = document.createElement('tr');
    for (let c = 0; c < cols.length; c++) {
      const td = document.createElement(c === 0 ? 'th' : 'td');
      td.innerText = cols[c].get(entry, i);
      td.style.textAlign = 'center';
      td.style.padding = '2px 2px';
      td.style.border = '1px solid rgba(255,255,255,0.2)';
      td.style.color = '#ffffff';
      td.style.overflow = 'hidden';
      td.style.textOverflow = 'ellipsis';
      td.style.whiteSpace = 'nowrap';
      if (c === 1) td.style.textAlign = 'left';
      if (c === 0) {
        td.style.fontWeight = 'bold';
      }
      if (i < 3) {
        td.style.background = medalBg[i];
        if (c === 0) td.style.color = medalBorder[i];
      } else {
        td.style.background = 'rgba(0,0,0,0.18)';
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function renderLeaderboardTableInto(container, opts = {}) {
  while (container.firstChild) container.removeChild(container.firstChild);
  const list = loadLeaderboard();
  if (list.length === 0) {
    container.innerHTML = '<div style="opacity:.8">No scores yet</div>';
    return;
  }
  container.appendChild(buildLeaderboardTable(list, opts));
}

function loadLeaderboard() {
  try {
    const raw = localStorage.getItem(LB_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    const list = parsed.map(normalizeLeaderboardEntry);
    list.sort((a,b) => b.score - a.score || a.ts - b.ts);
    return list.slice(0, LB_MAX);
  } catch (e) { return []; }
}

function saveLeaderboard(list) {
  try {
    const normalized = Array.isArray(list) ? list.map(normalizeLeaderboardEntry) : [];
    normalized.sort((a,b) => b.score - a.score || a.ts - b.ts);
    localStorage.setItem(LB_KEY, JSON.stringify(normalized.slice(0, LB_MAX)));
  } catch (e) { /* ignore */ }
}

function updateLastSavedEntryName(newName) {
  if (!lastSavedEntry) return;
  const list = loadLeaderboard();
  const idx = list.findIndex((it) => Number(it.ts) === Number(lastSavedEntry.ts) && Number(it.score) === Number(lastSavedEntry.score));
  if (idx < 0) return;
  list[idx].name = String(newName || 'Player').slice(0, 16);
  saveLeaderboard(list);
  lastSavedEntry = list[idx];
}

function addScore(name, score, details = {}) {
  const list = loadLeaderboard();
  const entry = normalizeLeaderboardEntry({
    name: name || 'Player',
    score: Number(score) || 0,
    ts: Date.now(),
    playedSec: details.playedSec,
    stats: details.stats || {},
  });
  list.push(entry);
  list.sort((a,b) => b.score - a.score || a.ts - b.ts);
  saveLeaderboard(list);
  // keep reference to the entry we just added for in-overlay edits
  lastSavedEntry = entry;
  return list.slice(0, LB_MAX);
}

// Configure name input element to be focusable and prevent Kaboom/global handlers from stealing events
function configureNameInput(){
  const inp = document.getElementById('dom-player-name');
  if (!inp) return;
  inp.tabIndex = 0;
  // prevent global listeners (Kaboom) from receiving keyboard/pointer events while typing
  ['keydown','keypress','keyup','input'].forEach(ev => inp.addEventListener(ev, (e)=>{ e.stopPropagation(); }));
  ['mousedown','touchstart','click'].forEach(ev => inp.addEventListener(ev, (e)=>{ e.stopPropagation(); }));
  // pressing Enter should exit the input (blur) so the player can use keys afterwards
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); try { inp.blur(); } catch (ex) {} } });
  // do not auto-focus here; user must click to edit name
}

/* =======================

======================= */
function resetGame() {
  // allow starting without an entered name — default to 'Player'
  const nameInputReq = document.getElementById('dom-player-name');
  const provided = nameInputReq && nameInputReq.value ? nameInputReq.value.trim() : '';
  currentPlayerName = provided || 'Player';
  // remove any previous name warning if present
  const warnOld = document.getElementById('dom-name-warn'); if (warnOld && warnOld.parentNode) warnOld.parentNode.removeChild(warnOld);
  started = true;
  gameOver = false;
  clearGameOverOverlayTimeout();
  score = 0;
  roundStartedAt = Date.now();

  // reset per-round counters
  resetRoundCounters();

  elapsed = 0;
  tickAcc = 0;
  blinkAcc = 0;

  resetLockSystem();

  destroyMany(["snake", "food", "ui", "grid", "border", "obs", "warn", "snake_glow", "bluefood_glow"]);

  drawGrid();
  drawBorder();

  uiText = null;
  ensureHud();

  // positioniere Start-Schlange zentriert im Grid
  const midX = Math.floor(cols / 2);
  const midY = Math.floor(rows / 2);
  snake = [
    { x: midX,     y: midY },
    { x: midX - 1, y: midY },
    { x: midX - 2, y: midY },
  ];
  dir = { x: 1, y: 0 };

  food = spawnFood();
  stopSpecialSpawnTimers();
  clearSpecialFoodsAndEffects();
  startSpecialSpawnTimers();
  // initialize prevSnake for smooth interpolation
  prevSnake = snake.map(p => ({ x: p.x, y: p.y }));
  drawGame();
  updateHUD();
  // hide DOM start button while running
  const sbtn = document.getElementById('dom-start-btn');
  if (sbtn) sbtn.style.display = 'none';
  // remove start-help button when game starts
  try { const hb = document.getElementById('dom-help-btn-start'); if (hb) hb.remove(); } catch(e){}
  try { const ms = document.getElementById('dom-mobile-start-play'); if (ms) ms.remove(); } catch(e){}
  // remove any game-over overlay from previous session
  const goOverlay = document.getElementById('dom-gameover-overlay');
  if (goOverlay) goOverlay.remove();
  // disable top name input while the game is running (prevent edits during play)
  setTopNameInputState(false);
  applyResponsiveDomFonts();
  applyResponsiveUiLayout();
  // focus body so keyboard input works after clicking start
  try { document.body.focus(); } catch (e) { /* ignore */ }
}

/* =======================
   Game logic
======================= */
function moveSnake() {
  const head = snake[0];
  const newHead = { x: head.x + dir.x, y: head.y + dir.y };
  snake.unshift(newHead);
  snake.pop();
}

function checkCollisions() {
  const head = snake[0];

  // Wand
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return true;

  // Blocked Tile
  const bk = key(head.x, head.y);
  if (blocked.has(bk)) {
    if (blueActive) {
      // consume blocked tile while blue: +1 score, remove block
      try { spawnWallCrunchFx(head.x, head.y); } catch(e){}
      blocked.delete(bk);
      try { blockedMeta.delete(bk); } catch(e){}
      markBlockedVisualDirty();
      score += 1;
      try { blockedEatenDuringBlue += 1; } catch(e){}
      try { const cx = head.x * cell + cell/2; const cy = head.y * cell + cell/2; spawnScorePopup(cx, cy, '+1', [60,140,220]); } catch(e){}
    } else {
      return true;
    }
  }

  // Selbstkollision
  for (let i = 1; i < snake.length; i++) {
    if (head.x === snake[i].x && head.y === snake[i].y) return true;
  }

  // Essen
  if (food && head.x === food.x && head.y === food.y) {
    try { spawnEatBurstFx(food.x, food.y, [200, 30, 30]); } catch(e){}
    snake.push({ ...snake[snake.length - 1] });
    score += 1;
    // spawn +1 popup at food position
    try { const cx = food.x * cell + cell/2; const cy = food.y * cell + cell/2; spawnScorePopup(cx, cy, '+1', [200,30,30]); } catch(e){}
    // count normal apples
    try { applesNormalCount += 1; } catch(e){}

      eatenCount += 1;
      food = spawnFood(); // ✅ spawnFood verhindert blocked/pending

      // lock scheduling behavior depends on score thresholds
      try {
        if (score >= 25) {
          // every normal apple creates a pending lock
          if (!placeBlockedImmediate()) scheduleLockCell();
        } else {
          // schedule a lock once we reached the randomized threshold
          if (nextLockAt === null) nextLockAt = eatenCount + lockDeltaForScore();
          if (eatenCount >= nextLockAt) {
            scheduleLockCell();
            // set next threshold according to current score
            nextLockAt = eatenCount + lockDeltaForScore();
          }
        }
      } catch(e) { /* ignore */ }
  }

  // golden apple collected
  if (goldenFood && head.x === goldenFood.x && head.y === goldenFood.y) {
    try { spawnEatBurstFx(goldenFood.x, goldenFood.y, [230, 180, 30]); } catch(e){}
    // give 3 points (does not count towards eatenCount)
    score += GOLD_SCORE;
    // increase snake length by 3 (do not affect speed / eatenCount)
    try { snake.push({ ...snake[snake.length - 1] }); snake.push({ ...snake[snake.length - 1] }); snake.push({ ...snake[snake.length - 1] }); } catch (e) {}
    // remove golden apple entity
    try { const cgx = goldenFood.x * cell + cell/2; const cgy = goldenFood.y * cell + cell/2; spawnScorePopup(cgx, cgy, '+3', [230,180,30]); } catch(e){}
    // count golden apples
    try { applesGoldenCount += 1; } catch(e){}
    goldenFood = null;
    try { destroyAll('goldfood'); } catch(e){}
    try { if (!placeBlockedImmediate()) scheduleLockCell(); } catch(e){}
  }

  // blue apple collected
  if (blueFood && head.x === blueFood.x && head.y === blueFood.y) {
    try { spawnEatBurstFx(blueFood.x, blueFood.y, [60, 140, 220]); } catch(e){}
    // activate effect for BLUE_DURATION seconds
    blueActive = true;
    blueRemaining = BLUE_DURATION;
    // clear any scheduled blue spawn so cooldown starts after effect
    try { if (blueSpawnTimeout) clearTimeout(blueSpawnTimeout); } catch(e){}
    blueSpawnTimeout = null;
    // visual + popup
    try { const cbx = blueFood.x * cell + cell/2; const cby = blueFood.y * cell + cell/2; spawnScorePopup(cbx, cby, 'BLUE', [60,140,220]); } catch(e){}
    try { triggerBlueModeSwitchFx(true); } catch(e){}
    // count blue apples
    try { applesBlueCount += 1; } catch(e){}
    blueFood = null;
    try { destroyAll('bluefood'); } catch(e){}
    try { destroyAll('bluefood_glow'); } catch(e){}
    try { if (!placeBlockedImmediate()) scheduleLockCell(); } catch(e){}
  }

  // green apple collected
  if (greenFood && head.x === greenFood.x && head.y === greenFood.y) {
    try { spawnEatBurstFx(greenFood.x, greenFood.y, [26, 190, 96]); } catch(e){}
    // no score for green apple (shrinks snake)
    // shrink snake by 2 segments but not below length 3
    try {
      const remove = Math.min(2, Math.max(0, snake.length - 3));
      const removed = [];
      for (let r=0;r<remove;r++) {
        const tail = snake[snake.length - 1];
        if (tail) removed.push({ x: tail.x, y: tail.y });
        snake.pop();
      }
      spawnTailShrinkFx(removed);
    } catch(e){}
    // visual + popup
    try { const cgx = greenFood.x * cell + cell/2; const cgy = greenFood.y * cell + cell/2; spawnScorePopup(cgx, cgy, '-2', [60,220,120]); } catch(e){}
    // count green apples
    try { applesGreenCount += 1; } catch(e){}
    greenFood = null;
    try { destroyAll('greenfood'); } catch(e){}
    try { if ((applesGreenCount % 2) === 0) { if (!placeBlockedImmediate()) scheduleLockCell(); } } catch(e){}
  }

  return false;
}

function step() {
  // remember previous positions for interpolation
  prevSnake = snake.map(p => ({ x: p.x, y: p.y }));
  moveSnake();
  if (checkCollisions()) {
    endGame();
    return;
  }
  // allow one direction change for the next tick
  canChangeDir = true;
}

/* =======================
   Game Over
======================= */
function endGame() {
  gameOver = true;
  clearGameOverOverlayTimeout();
  blinkAcc = 0;

  try { spawnSnakeGameOverFx(snake ? snake.map((p) => ({ x: p.x, y: p.y })) : []); } catch (e) {}

  stopSpecialSpawnTimers();
  clearSpecialFoodsAndEffects();
  

  // save score to leaderboard
  try {
    const playedSec = getRoundPlayedSeconds();
    addScore(currentPlayerName || 'Player', score, {
      playedSec,
      stats: getRoundStatsSnapshot(),
    });
  } catch (e) { /* ignore */ }

  gameOverTitle = add([
    text("GAME OVER", { size: getResponsiveTextSize(56, 30), font: "pixel" }),
    pos(width() / 2, height() / 2 - 35),
    anchor("center"),
    color(255, 0, 0),
    z(Z_UI),
    fixed(),

  ]);

  restartHint = add([

  gameOverOverlayTimeout = setTimeout(() => {

  }, 420);
}

/* =======================
   Input
======================= */
function trySetDir(newDir) {
  if (!started || paused || gameOver) return;
  if (!canChangeDir) return;
  if (isOpposite(newDir, dir)) return;
  dir = newDir;
  canChangeDir = false;
}

onKeyPress("w", () => trySetDir({ x: 0, y: -1 }));
onKeyPress("s", () => trySetDir({ x: 0, y:  1 }));
onKeyPress("a", () => trySetDir({ x: -1, y: 0 }));
onKeyPress("d", () => trySetDir({ x:  1, y: 0 }));

onKeyPress("space", () => {
  handlePauseToggleInput();
});

// Fallback: falls Kabooms onKeyPress aus irgendeinem Grund nicht feuert
window.addEventListener("keydown", (e) => {
  // don't start/reset when typing in an input
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
  if (e.code === "Space") {
    handlePauseToggleInput();
    e.preventDefault();
  }
});

// Zusätzlicher Fallback: WASD / Pfeiltasten an trySetDir weiterleiten
window.addEventListener('keydown', (e) => {
  // don't capture keys while typing in input/textarea
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
  const k = (e.key || '').toLowerCase();
  if (!k) return;
  if (k === 'w' || e.key === 'ArrowUp') { trySetDir({ x: 0, y: -1 }); e.preventDefault(); }
  if (k === 's' || e.key === 'ArrowDown') { trySetDir({ x: 0, y:  1 }); e.preventDefault(); }
  if (k === 'a' || e.key === 'ArrowLeft') { trySetDir({ x: -1, y: 0 }); e.preventDefault(); }
  if (k === 'd' || e.key === 'ArrowRight') { trySetDir({ x:  1, y: 0 }); e.preventDefault(); }
});

/* =======================
   Loops
======================= */

// Game Loop (nur wenn gestartet & nicht GameOver)
onUpdate(() => {
  if (!started || paused || gameOver) return;

  const dtSec = dt();
  elapsed += dtSec;
  // advance food spawn timers and expire after 15s
  ageItemAndExpire(food, dtSec, () => {
    try { expireFood(); } catch(e) { destroyAllSafe('food'); food = spawnFood(); }
  });
  ageItemAndExpire(goldenFood, dtSec, () => {
    try { expireGoldenFood(); } catch(e) { goldenFood = null; destroyAllSafe('goldfood'); }
  });
  ageItemAndExpire(blueFood, dtSec, () => {
    try { expireBlueFood(); } catch(e) { blueFood = null; destroyMany(['bluefood', 'bluefood_glow']); }
  });
  ageItemAndExpire(greenFood, dtSec, () => {
    try { expireGreenFood(); } catch(e) { greenFood = null; destroyAllSafe('greenfood'); }
  });
  // blue effect timer
  if (blueActive) {
    blueRemaining -= dtSec;
    if (blueRemaining <= 0) {
      blueActive = false;
      blueRemaining = 0;
      try { triggerBlueModeSwitchFx(false); } catch(e){}
      // after effect ends, start cooldown for next blue spawn
      try { scheduleBlueSpawn(); } catch(e){}
    }
  }

  // pendingLock Timer + ggf. aktivieren
  if (pendingLock) {
    pendingLock.t += dtSec;
    if (pendingLock.t >= lockWarnTime) {
      // before setting, ensure no food occupies this cell
      const lx = pendingLock.x, ly = pendingLock.y;
      const occupiedByFood = (food && food.x === lx && food.y === ly) || (goldenFood && goldenFood.x === lx && goldenFood.y === ly) || (blueFood && blueFood.x === lx && blueFood.y === ly) || (greenFood && greenFood.x === lx && greenFood.y === ly);
      if (occupiedByFood) {
        // try to schedule a different lock instead
        pendingLock = null;
        try { scheduleLockCell(); } catch(e){}
      } else {
        // set blocked with a random variant type
        setBlockedTile(lx, ly, null);
        pendingLock = null;
      }
    }
  }

  const speed = getCurrentSpeed();
  const tickInterval = 1 / speed;

  tickAcc += dtSec;

  while (tickAcc >= tickInterval) {
    tickAcc -= tickInterval;
    step();
    if (gameOver) break;
  }

  // draw interpolated snake between previous and current grid positions
  const interp = Math.min(1, tickAcc / tickInterval);
  drawGame(interp);

  updateHUD();
});

// Blinken (Start + GameOver)
onUpdate(() => {
  const blinkStart = (!started && startHint);
  const blinkRestart = (gameOver && restartHint);
  if (!blinkStart && !blinkRestart) return;

  blinkAcc += dt();
  const on = Math.sin(blinkAcc * 6) > 0;
  const alpha = on ? 1 : 0;

  if (blinkStart) startHint.opacity = alpha;
  if (blinkRestart) restartHint.opacity = alpha;
});

// Grass particle layer: subtle darker-green speckles with tiny sway
(function(){
  const id = 'grass-dots';
  let cvs, ctx, dots = [], raf = null, start = performance.now();
  let gameRect = null;

  function makeCanvas(){
    cvs = document.getElementById(id);
    if (!cvs) {
      cvs = document.createElement('canvas');
      cvs.id = id;
      cvs.style.position = 'fixed';
      cvs.style.left = '0';
      cvs.style.top = '0';
      cvs.style.width = '100%';
      cvs.style.height = '100%';
      cvs.style.pointerEvents = 'none';
      cvs.style.zIndex = '1';
      document.body.appendChild(cvs);
    }
    ctx = cvs.getContext('2d');
    resize();
  }

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    cvs.width = Math.max(300, Math.round(window.innerWidth * dpr));
    cvs.height = Math.max(300, Math.round(window.innerHeight * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    updateGameRect();
    createDots();
  }

  function updateGameRect(){
    const g = document.querySelector('canvas');
    if (g) {
      gameRect = g.getBoundingClientRect();
    } else {
      gameRect = { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
    }
  }

  function createDots(){
    dots = [];
    const gw = (gameRect && gameRect.width) || window.innerWidth;
    const gh = (gameRect && gameRect.height) || window.innerHeight;
    const gx = (gameRect && gameRect.left) || 0;
    const gy = (gameRect && gameRect.top) || 0;
    const area = gw * gh;
    const base = Math.round(area / 6000);
    const count = Math.max(60, Math.min(1600, base * 2)); // doubled particle density
    for (let i = 0; i < count; i++){
      dots.push({
        x: gx + Math.random() * gw,
        y: gy + Math.random() * gh,
        r: 0.5 + Math.random() * 1.6,
          alpha: 0.06 + Math.random() * 0.18,
          phase: Math.random() * Math.PI * 2,
          amp: 0
      });
    }
  }

  function draw(t){
    if (!ctx) return;
    ctx.clearRect(0,0, window.innerWidth, window.innerHeight);
    const time = (t - start) / 1000;
    for (const p of dots){
      const y = p.y;
      // only draw if inside current game rect
      if (gameRect) {
        if (p.x < gameRect.left - 4 || p.x > gameRect.left + gameRect.width + 4) continue;
        if (y < gameRect.top - 4 || y > gameRect.top + gameRect.height + 4) continue;
      }
      ctx.beginPath();
      ctx.fillStyle = `rgba(18,70,18,${p.alpha})`;
      ctx.arc(p.x, y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { if (cvs) resize(); });
  window.addEventListener('orientationchange', () => { if (cvs) resize(); });
  // occasionally poll the game canvas rect (safer than observing all DOM mutations)
  setInterval(() => {
    if (!cvs) return;
    const prev = gameRect;
    updateGameRect();
    // only recreate dots when rect changed meaningfully
    if (!prev || prev.width !== gameRect.width || prev.height !== gameRect.height || prev.left !== gameRect.left || prev.top !== gameRect.top) {
      createDots();
    }
  }, 600);
  makeCanvas();
  raf = requestAnimationFrame(draw);
})();
